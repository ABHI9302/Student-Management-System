<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Enroll Student to Courses</h2>
                <a th:href="@{/enrollments/enrollmentList}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Enrolled Students
                </a>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-check2-square me-1"></i> Enrollment Details
                </div>

                <div class="card-body">

                    <form th:action="@{/enrollments/enrollCourse}" th:object="${enrollmentDto}" method="post">

                        <!-- Student -->
                        <div class="mb-3">
                            <label for="studentId" class="form-label">Student</label>
                            <select id="studentId" class="form-select"
                                    th:field="*{studentId}"
                                    th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">
                                <option value="">-- Select a student --</option>
                                <option th:each="s : ${studentList}"
                                        th:value="${s.id}"
                                        th:text="|${s.firstName} ${s.lastName} (${s.email})|"></option>
                            </select>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('studentId')}"
                                 th:errors="*{studentId}"></div>
                        </div>

                        <!-- Courses -->
                        <div class="mb-3">
                            <label class="form-label d-block">Courses</label>

                            <div class="text-muted" th:if="${courseList == null || courseList.isEmpty()}">
                                <i class="bi bi-exclamation-circle me-1"></i> No active courses available.
                            </div>

                            <div class="form-check" th:each="c, iter : ${courseList}">
                                <input class="form-check-input" type="checkbox"
                                       th:id="${'course_' + c.id}"
                                       th:field="*{courseIds}"
                                       th:value="${c.id}">
                                <label class="form-check-label" th:for="${'course_' + c.id}"
                                       th:text="|${c.courseName} (${c.courseCode}) - Rs.${c.fee}|"></label>
                            </div>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('courseIds')}"
                                 th:errors="*{courseIds}"></div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2 me-1"></i> Enroll
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
