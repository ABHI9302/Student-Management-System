spring.application.name=studentmanagement
server.port=8080

# MySQL connection (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD if needed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_mgmt_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate auto-detects the MySQL dialect; no explicit dialect needed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always
